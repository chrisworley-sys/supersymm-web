<svg width="326" height="323" viewBox="0 0 326 323" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animated SuperSymm logomark">
  <style>
    :root {
      --path-length: 1000;
    }

    svg {
      overflow: visible;
      background: transparent;
    }

    .base-line,
    .glow-line,
    .trace-head-build,
    .trace-head-loop,
    .glimmer-line {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }

    .base-line {
      stroke: url(#paint0_linear_175_423);
      stroke-width: 3;
      stroke-dasharray: var(--path-length);
      stroke-dashoffset: var(--path-length);
      animation: traceBuild 6.8s cubic-bezier(.62, 0, .2, 1) forwards;
    }

    .glow-line {
      stroke: url(#paint0_linear_175_423);
      stroke-width: 6;
      opacity: 0;
      filter: url(#pinkGlow);
      stroke-dasharray: var(--path-length);
      stroke-dashoffset: var(--path-length);
      animation:
        glowBuild 6.8s cubic-bezier(.62, 0, .2, 1) forwards,
        glowPulse 3.8s ease-in-out 6.8s infinite;
    }

    .trace-head-build {
      stroke: url(#traceGradient);
      stroke-width: 5;
      opacity: 0;
      filter: url(#whiteGlow);
      stroke-dasharray: 85 915;
      stroke-dashoffset: var(--path-length);
      animation: traceHeadBuild 6.8s linear forwards;
    }

    .trace-head-loop {
      stroke: url(#traceGradient);
      stroke-width: 4.5;
      opacity: 0;
      filter: url(#whiteGlow);
      stroke-dasharray: 65 935;
      stroke-dashoffset: 1000;
      animation:
        loopOn 0.01s linear 6.8s forwards,
        traceHeadLoop 7.5s linear 6.8s infinite;
    }

    .glimmer-line {
      stroke: url(#glimmerGradient);
      stroke-width: 4;
      opacity: 0;
      filter: url(#whiteGlow);
      stroke-dasharray: 90 910;
      stroke-dashoffset: 90;
      animation:
        glimmerOn 0.01s linear 6.8s forwards,
        glimmerTravel 4.8s linear 6.8s infinite;
    }

    @keyframes traceBuild {
      0%   { stroke-dashoffset: var(--path-length); opacity: 0.2; }
      10%  { opacity: 0.95; }
      100% { stroke-dashoffset: 0; opacity: 1; }
    }

    @keyframes glowBuild {
      0%   { stroke-dashoffset: var(--path-length); opacity: 0; }
      20%  { opacity: 0.1; }
      100% { stroke-dashoffset: 0; opacity: 0.14; }
    }

    @keyframes traceHeadBuild {
      0%   { stroke-dashoffset: var(--path-length); opacity: 0.7; }
      88%  { opacity: 0.7; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

    @keyframes loopOn {
      100% { opacity: 0.5; }
    }

    @keyframes traceHeadLoop {
      0%   { stroke-dashoffset: 1000; opacity: 0.18; }
      18%  { opacity: 0.42; }
      82%  { opacity: 0.35; }
      100% { stroke-dashoffset: 0; opacity: 0.12; }
    }

    @keyframes glimmerOn {
      100% { opacity: 0.45; }
    }

    @keyframes glimmerTravel {
      0%   { stroke-dashoffset: 90; opacity: 0.1; }
      20%  { opacity: 0.32; }
      80%  { opacity: 0.26; }
      100% { stroke-dashoffset: -910; opacity: 0.08; }
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.08; }
      50%       { opacity: 0.18; }
    }

    @media (prefers-reduced-motion: reduce) {
      .base-line,
      .glow-line,
      .trace-head-build,
      .trace-head-loop,
      .glimmer-line {
        animation: none !important;
      }
      .base-line  { stroke-dashoffset: 0; opacity: 1; }
      .glow-line  { stroke-dashoffset: 0; opacity: 0.12; }
      .trace-head-build,
      .trace-head-loop,
      .glimmer-line { opacity: 0; }
    }
  </style>

  <defs>
    <linearGradient id="paint0_linear_175_423" x1="73.1192" y1="209.935" x2="398.289" y2="209.935" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22193B"/>
      <stop offset="1" stop-color="#E977C1"/>
    </linearGradient>

    <linearGradient id="traceGradient" x1="0" y1="0" x2="326" y2="323" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.38" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="0.5"  stop-color="#FFF8FF" stop-opacity="0.85"/>
      <stop offset="0.7"  stop-color="#E977C1" stop-opacity="0.4"/>
      <stop offset="1"    stop-color="#E977C1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glimmerGradient" x1="0" y1="0" x2="326" y2="323" gradientUnits="userSpaceOnUse">
      <stop offset="0"    stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.03"/>
      <stop offset="0.52" stop-color="#FFFFFF" stop-opacity="0.45"/>
      <stop offset="0.62" stop-color="#FFD3EF" stop-opacity="0.28"/>
      <stop offset="1"    stop-color="#E977C1" stop-opacity="0"/>
    </linearGradient>

    <filter id="pinkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="whiteGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <path id="logoPath" pathLength="1000" d="M96.0825 1.54639H228.083M96.0825 1.54639L162.583 68.0464L135.083 94.5464M96.0825 1.54639L95.5825 94.5464M228.083 1.54639L321.083 94.5464M228.083 1.54639V94.5464M321.083 94.5464H228.083M321.083 94.5464L255.083 161.546L229.747 189.366M228.083 94.5464H190.583V133.046M69.5825 161.546L3.58252 95.5464L95.5825 94.5464M69.5825 161.546L95.5825 133.046M69.5825 161.546L4.08252 228.046H97.0825M69.5825 161.546L97.0825 188.046M95.5825 133.046H135.083M95.5825 133.046L123.083 161.546M95.5825 133.046V94.5464M135.083 133.046V94.5464M135.083 133.046V149.546M135.083 94.5464H95.5825M135.083 94.5464L162.583 121.046M97.0825 188.046L123.083 161.546M97.0825 188.046H135.083M97.0825 188.046V228.046M123.083 161.546L135.083 149.546M123.083 161.546L135.083 173.046M190.583 133.046H226.583L202.083 161.546M190.583 133.046V150.046M162.583 121.046L150.083 133.046H174.083L190.583 150.046M162.583 121.046L190.083 94.5464L163.583 69.0464M162.583 121.046L174.583 133.546M135.083 149.546V173.046M135.083 173.046V188.046M135.083 188.046V228.046M174.083 189.546H151.083L162.583 200.546M174.083 189.546L190.583 173.046M174.083 189.546L162.583 200.546M190.583 173.046V150.046M190.583 173.046V189.546M190.583 173.046V150.546L202.083 161.546M190.583 173.046L202.083 161.546M202.083 161.546L229.747 189.366M229.747 189.366L229.583 189.546M190.583 189.546H229.583M190.583 189.546V226.546M229.583 189.546V226.546L228.583 319.046L162.583 254.546M162.583 200.546L135.083 228.046M135.083 228.046L162.583 254.546M189.083 226.546L162.583 254.546M162.583 254.546L98.0825 319.046L97.0825 228.046M163.083 69.0464L228.083 2.04639M191.083 133.046H150.583M150.583 133.046H134.583M150.583 133.046L135.083 149.046V173.546L151.583 190.046M228.083 95.5425V133.248L321.083 225.046C320.887 174.083 321.278 146.01 321.083 95.0464M162.583 201.046L188.083 227.046H321.583L229.583 321.046H97.0825L3.08252 228.546V96.0464L95.5825 1.04639M98.0825 228.046H134.583"/>
  </defs>

  <use href="#logoPath" class="glow-line"/>
  <use href="#logoPath" class="base-line"/>
  <use href="#logoPath" class="trace-head-build"/>
  <use href="#logoPath" class="trace-head-loop"/>
  <use href="#logoPath" class="glimmer-line"/>
</svg>
